name: Risk Engine horario

on:
  workflow_dispatch:

  schedule:
    - cron: "25 13-20 * * 1-5"

concurrency:
  group: risk-engine-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calculate-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Risk Engine
        run: python risk_engine.py

      - name: Validar estado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("state/risk_state.json")

          if not path.exists():
              raise SystemExit("No se creó state/risk_state.json")

          data = json.loads(path.read_text(encoding="utf-8"))

          required = [
              "schema_version",
              "generated_at_utc",
              "market_date",
              "risk_level",
              "block_new_entries",
              "SPY",
              "QQQ",
          ]

          missing = [key for key in required if key not in data]

          if missing:
              raise SystemExit(
                  "Faltan campos: " + ", ".join(missing)
              )

          print("Estado válido.")
          print("Market date:", data["market_date"])
          print("Risk level:", data["risk_level"])
          print("SPY factor:", data["SPY"]["max_exposure_factor"])
          print("QQQ factor:", data["QQQ"]["max_exposure_factor"])
          PY

      - name: Publicar nuevo estado
        run: |
          if git diff --quiet -- state/risk_state.json; then
            echo "El estado no cambió."
            exit 0
          fi

          git config user.name "risk-engine-bot"
          git config user.email \
            "risk-engine-bot@users.noreply.github.com"

          git add state/risk_state.json
          git commit -m \
            "Actualizar estado de riesgo [skip ci]"
          git push
